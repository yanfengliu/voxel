name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  FORCE_COLOR: '0'

jobs:
  node-24-complete:
    name: Node 24 complete (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Windows leg of this job finished in 29m28s against the 30 minutes it
    # used to be given, and that was a run which gave up on four browser tests
    # early. A green run does strictly more work than a red one, so the budget
    # that looked sufficient was already the next failure.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux browser dependencies
        if: runner.os == 'Linux'
        run: npm run test:browser:install -- --with-deps

      - name: Install Chromium
        if: runner.os == 'Windows'
        run: npm run test:browser:install

      - name: Run complete verification gate
        id: verify
        run: npm run verify

      # A browser failure that only happens on one runner is only a pixel count
      # in a log until someone can open the images. Playwright writes the
      # `-actual`, `-expected` and `-diff` PNGs, the on-failure screenshots and
      # the retained traces into `outputDir` (`playwright.config.ts`), and the
      # runner then throws them away. This is the only Linux this fleet has.
      #
      # Conditioned on this step rather than on `failure()`, because `npm run
      # verify` builds, unit-tests, typechecks and lints before it reaches
      # Playwright: a failure earlier in the job leaves no output directory, and
      # naming the step keeps the upload attached to the gate that produces it.
      # `if-no-files-found` stays at its default `warn` for that same case.
      #
      # `always()` and not `!cancelled()`, because a job killed by its own
      # `timeout-minutes` is reported as CANCELLED, and that is the case this
      # repository most needs the pictures for: `timeout-minutes: 60` above is
      # itself a budget sized from a measurement, and the browser lane has been
      # sitting against it. Measured, not assumed — run 35178071008 killed both
      # Windows legs at exactly their caps, and the API reports
      # `steps.verify.outcome == 'cancelled'` with this step `skipped`, while
      # the Ubuntu leg that failed normally reported `failure` and uploaded.
      # `!cancelled()` is false during cancellation; `always()` is the one
      # documented function that still evaluates there.
      #
      # It is deliberately not `always()` alone: `outcome` is `skipped` when an
      # earlier step failed, and `success` needs no evidence. A user- or
      # concurrency-initiated cancel is indistinguishable from a timeout kill at
      # this level, so a superseded run will also upload its partial output;
      # seven days of retention is what bounds that.
      #
      # Seven days: this is diagnostic evidence for the run that produced it,
      # read within a day or two of the failure and worthless once the failure
      # is understood, so it does not want the 90-day default sitting in storage.
      - name: Upload Playwright failure output
        if: ${{ always() && (steps.verify.outcome == 'failure' || steps.verify.outcome == 'cancelled') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-output-${{ matrix.os }}
          path: output/playwright/
          retention-days: 7

  node-22-portable:
    name: Node 22 portable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify public API compatibility
        run: npm run test:api --if-present

      - name: Verify packed portable consumer
        run: npm run test:core-only-package

  audit-and-package:
    name: Audit and package (ubuntu-latest, Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Audit runtime dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --audit-level=high

      - name: Inspect package contents
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm pack --dry-run
